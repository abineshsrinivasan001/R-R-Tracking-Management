<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — DevOps R&R Tracker</title>
  <meta name="description"
    content="Sign in to the Enterprise DevOps Roles & Responsibilities Tracker to manage your infrastructure tasks." />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  {% load static %}

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b2e;
      --navy-800: #132338;
      --navy-700: #1a3a70;
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --violet: #7c3aed;
      --cyan: #06b6d4;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    html,
    body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: var(--slate-900);
      overflow: hidden;
    }

    .display {
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    /* ── Layout ── */
    .login-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      flex: 0 0 46%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* subtle corner accent */
    .left-panel::before {
      content: '';
      position: absolute;
      top: -80px;
      left: -80px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(59, 130, 246, .12) 0%, transparent 70%);
      pointer-events: none;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(124, 58, 237, .10) 0%, transparent 70%);
      pointer-events: none;
    }

    .left-inner {
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 2;
    }

    /* Brand pill at top */
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 999px;
      padding: 6px 14px 6px 8px;
      margin-bottom: 32px;
    }

    .brand-pill-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
    }

    .brand-pill-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--slate-600);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Heading */
    .login-heading {
      font-size: 30px;
      font-weight: 800;
      color: var(--slate-900);
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--slate-500);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Error box */
    .error-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      animation: fadeIn .3s ease;
    }

    .error-box i {
      color: var(--rose);
      margin-top: 2px;
      font-size: 13px;
    }

    .error-box p {
      font-size: 13px;
      color: #be123c;
      font-weight: 600;
      line-height: 1.4;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--slate-400);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--slate-300);
      transition: color .2s;
      pointer-events: none;
    }

    .field-wrap:focus-within .field-icon {
      color: var(--blue);
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--slate-50);
      border: 1.5px solid var(--slate-200);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--slate-900);
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .form-input::placeholder {
      color: var(--slate-300);
    }

    .form-input:focus {
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .10);
    }

    /* password toggle */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--slate-300);
      font-size: 13px;
      transition: color .2s;
      padding: 4px;
    }

    .toggle-pw:hover {
      color: var(--slate-500);
    }

    /* forgot link */
    .pw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .forgot-link {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: color .2s;
    }

    .forgot-link:hover {
      color: var(--blue-dark);
    }

    /* Submit button */
    .btn-signin {
      width: 100%;
      margin-top: 10px;
      padding: 15px 20px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(13, 27, 46, .18);
      letter-spacing: .02em;
    }

    .btn-signin:hover {
      background: var(--navy-800);
      box-shadow: 0 12px 32px rgba(13, 27, 46, .28);
      transform: translateY(-1px);
    }

    .btn-signin:active {
      transform: scale(.985);
    }

    .btn-signin i {
      font-size: 11px;
      opacity: .7;
    }

    /* Trust badges */
    .trust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
    }

    .trust-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--slate-500);
      font-weight: 600;
    }

    .trust-badge i {
      font-size: 11px;
    }

    /* Divider */
    .divider {
      width: 1px;
      height: 14px;
      background: var(--slate-200);
    }

    /* Footer */
    .left-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--slate-400);
      font-weight: 500;
      letter-spacing: .03em;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1;
      background: var(--navy);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 40px;
    }

    /* Ambient glow blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .25;
      pointer-events: none;
    }

    .blob-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #3b82f6, transparent);
      top: -100px;
      right: -80px;
    }

    .blob-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #7c3aed, transparent);
      bottom: -60px;
      left: -60px;
    }

    .blob-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #06b6d4, transparent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: .12;
    }

    /* Grid pattern overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Right content */
    .right-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* Logo */
    .logo-container {
      width: 200px;
      height: 200px;
      position: relative;
      margin-bottom: 10px;
    }

    .logo-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1.5px solid rgba(59, 130, 246, .25);
      animation: spinRing 18s linear infinite;
    }

    .logo-ring-2 {
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 1px dashed rgba(124, 58, 237, .18);
      animation: spinRing 30s linear infinite reverse;
    }

    @keyframes spinRing {
      to {
        transform: rotate(360deg);
      }
    }

    .logo-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, .15) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
      border-radius: 50%;
      filter: drop-shadow(0 0 24px rgba(59, 130, 246, .4));
    }

    /* Fallback icon logo (if image fails) */
    .logo-icon-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      border-radius: 30px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      color: #fff;
      box-shadow: 0 0 48px rgba(59, 130, 246, .4);
    }

    .brand-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -.02em;
      margin-bottom: 12px;
    }

    .brand-title span {
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-desc {
      font-size: 14.5px;
      color: var(--slate-400);
      line-height: 1.65;
      max-width: 320px;
      margin-bottom: 36px;
    }

    /* Feature pills */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 12px;
      padding: 12px 16px;
      transition: background .2s;
      animation: slideIn .5s ease both;
    }

    .feature-item:nth-child(1) {
      animation-delay: .1s;
    }

    .feature-item:nth-child(2) {
      animation-delay: .2s;
    }

    .feature-item:nth-child(3) {
      animation-delay: .3s;
    }

    .feature-item:hover {
      background: rgba(255, 255, 255, .07);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(16px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .feature-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .fi-blue {
      background: rgba(59, 130, 246, .18);
      color: #60a5fa;
    }

    .fi-violet {
      background: rgba(124, 58, 237, .18);
      color: #a78bfa;
    }

    .fi-cyan {
      background: rgba(6, 182, 212, .18);
      color: #22d3ee;
    }

    .feature-text {
      text-align: left;
    }

    .feature-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .feature-sub {
      font-size: 11.5px;
      color: var(--slate-500);
      margin-top: 1px;
    }

    /* Status badge bottom */
    .status-row {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      padding: 7px 16px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--emerald);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    .status-text {
      font-size: 12px;
      color: var(--slate-400);
      font-weight: 600;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn .4s ease;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .right-panel {
        display: none;
      }

      .left-panel {
        flex: 1;
      }

      html,
      body {
        overflow: auto;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- ══ LEFT: LOGIN FORM ══ -->
    <div class="left-panel">
      <div class="left-inner fade-in">

        <!-- Brand Identifier -->
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 40px;">
          <div
            style="width: 36px; height: 36px; background: linear-gradient(135deg, var(--blue), var(--violet)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; box-shadow: 0 4px 12px rgba(59,130,246,0.2);">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <span
            style="font-size: 13px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.1em;">R&amp;R
            Tracker</span>
        </div>

        <!-- Heading -->
        <h1 class="login-heading display" style="margin-bottom: 28px;">Welcome back <br /></h1>

        <!-- Error -->
        {% if form.errors %}
        <div class="error-box">
          <i class="fa-solid fa-circle-exclamation"></i>
          <p>Invalid credentials. Please check your username and password and try again.</p>
        </div>
        {% endif %}

        <!-- Form -->
        <form method="post" id="loginForm" autocomplete="off">
          {% csrf_token %}

          <!-- Username -->
          <div class="form-group">
            <label class="form-label" for="id_username">Username</label>
            <div class="field-wrap">
              <i class="fa-solid fa-user field-icon"></i>
              <input type="text" id="id_username" name="username" class="form-input" placeholder="e.g. admin" required
                autofocus autocomplete="username" />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="pw-row">
              <label class="form-label" for="id_password" style="margin-bottom:0;">Password</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <div class="field-wrap">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="id_password" name="password" class="form-input" placeholder="••••••••••"
                required autocomplete="current-password" />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-signin" id="signinBtn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Sign In to Dashboard
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>


      </div>
    </div>

    <!-- ══ RIGHT: BRANDING PANEL ══ -->
    <div class="right-panel">
      <!-- Background effects -->
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grid-overlay"></div>

      <!-- Main content -->
      <div class="right-content">
        <!-- Logo -->
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-ring-2"></div>
          <div class="logo-glow"></div>
          <img src="{% static 'tracker/devops_logo.png' %}" alt="DevOps R&R Tracker Logo" class="logo-img"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />
          <div class="logo-icon-fallback" id="logoFallback">
            <i class="fa-solid fa-layer-group"></i>
          </div>
        </div>

        <h2 class="brand-title">
          DevOps <span>R&amp;R</span><br />Tracker
        </h2>

      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePw');
    const pwInput = document.getElementById('id_password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    // Loading state on submit
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('signinBtn');
    form.addEventListener('submit', () => {
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in…';
      btn.style.opacity = '.8';
      btn.disabled = true;
    });
  </script>

</body>

</html>
