<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Server Rack (Left side) -->
  <rect x="10" y="20" width="40" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="6" />
  <line x1="10" y1="40" x2="50" y2="40" stroke="#10b981" stroke-width="6" />
  <line x1="10" y1="60" x2="50" y2="60" stroke="#10b981" stroke-width="6" />
  
  <!-- Server indicator lights -->
  <circle cx="20" cy="30" r="3" fill="#14b8a6" />
  <circle cx="20" cy="50" r="3" fill="#14b8a6" />
  <circle cx="20" cy="70" r="3" fill="#14b8a6" />

  <!-- Database Stack (Right side) -->
  <ellipse cx="75" cy="30" rx="20" ry="8" fill="none" stroke="#10b981" stroke-width="6" />
  <path d="M55 30 V70 A20 8 0 0 0 95 70 V30" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Database layer separator -->
  <path d="M55 50 A20 8 0 0 0 95 50" fill="none" stroke="#10b981" stroke-width="6" />
  
  <!-- Database indicator light -->
  <circle cx="75" cy="60" r="3" fill="#14b8a6" />
</svg>
